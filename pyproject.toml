[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfip-claims"
version = "0.1.0"
description = "Data mining project on FEMA NFIP flood insurance claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # core data stack
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    # modelling / mining
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "mlxtend>=0.25.0",
    # plotting
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "plotly>=7.2.0",
    "folium>=1.0.0",
    # geospatial
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "mapclassify>=2.11.0",
    "esda>=2.10.0",
    "libpysal>=4.15.1",
    # data acquisition / utilities
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "jupytext>=1.19.7",
]

[tool.setuptools]
py-modules = ["nfip_project_utils"]
